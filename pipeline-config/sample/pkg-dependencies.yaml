# Example dependency reference file for the repository named provisioning.
#
# All sections in this file are specifically for release packaging:
# - powershellRepositories: source repos for PowerShell release packages
# - powershellModules: PowerShell release packages to download and stage in the archive
# - dotnetReleaseRepositories: source repos for .NET release packages
# - dotnetReleasePackages: .NET release packages to download and stage in the archive
# - pythonReleaseRepositories: source repos for Python release packages
# - pythonReleasePackages: Python release packages to download and stage in the archive
#
# For build/restore configuration (NuGet sources, Python indexes, pip tools),
# see pipeline-config/ref/test-dependencies.yaml.
#
# Version fields:
#   Omit 'version' or set it to "latest" to always stage the newest available release assets.
#   Set 'version' to a specific SemVer string (e.g. "5.6.1") to pin to that exact release.

powershellRepositories:
  - name: WebAccess
    sourceLocation: https://github.com/Semperis-Community/WebAccess/releases
  - name: smprsutilities
    sourceLocation: https://github.com/Semperis-Community/smprsutilities/releases

# PowerShell modules to stage in release packaging.
# When present, this list defines the release packages to download and include in the archive.
powershellModules:
  - name: WebAccess
    version: latest
  - name: smprsutilities
    version: latest


# .NET release package sources and package list.
# dotnetReleaseRepositories identifies repos whose latest release assets are staged into the package.
# dotnetReleasePackages lists the packages to include in the archive.
# Version fields:
#   Omit 'version' or set it to "latest" to always stage the newest available release assets.
#   Set 'version' to a specific SemVer string (e.g. "5.6.1") to pin to that exact release.
# Example:
#   dotnetReleaseRepositories:
#     - name: MyDotNetLib
#       sourceLocation: https://github.com/example-org/MyDotNetLib/releases
#   dotnetReleasePackages:
#     - name: MyDotNetLib
#       version: latest
dotnetReleaseRepositories: []
dotnetReleasePackages: []

# Python release package sources and package list.
# pythonReleaseRepositories identifies repos whose latest release assets are staged into the package.
# pythonReleasePackages lists the packages to include in the archive.
# Version fields:
#   Omit 'version' or set it to "latest" to always stage the newest available release assets.
#   Set 'version' to a specific SemVer string (e.g. "1.2.0") to pin to that exact release.
# Example:
#   pythonReleaseRepositories:
#     - name: MyPythonLib
#       sourceLocation: https://github.com/example-org/MyPythonLib/releases
#   pythonReleasePackages:
#     - name: MyPythonLib
#       version: latest
pythonReleaseRepositories: []
pythonReleasePackages: []

